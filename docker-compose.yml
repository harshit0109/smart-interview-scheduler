# Phase 1 stack: Postgres + Redis + empty backend.
# `docker compose up --build` -> backend health at http://localhost:8000/health
#
# The frontend service is owned by the frontend teammate; uncomment it once
# ./frontend exists (see IMPLEMENTATION.md Phase 1 / Phase 10).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: sis
      POSTGRES_DB: sis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sis:sis@db:5432/sis
      REDIS_URL: redis://redis:6379/0
      # First-ADMIN web bootstrap (POST /auth/bootstrap-admin, frontend /setup).
      # Passed through from the host env or the root .env (gitignored); empty by
      # default, which keeps the endpoint 404 — there is no public admin signup.
      # Without this passthrough the token cannot reach the container at all:
      # backend/.dockerignore excludes .env, so a backend/.env never ships.
      ADMIN_BOOTSTRAP_TOKEN: ${ADMIN_BOOTSTRAP_TOKEN:-}
      # Local demo: no Google Calendar OAuth client is configured, so run the
      # SIMULATED calendar path — scheduling treats panelists as free and booking
      # writes a provider='SIMULATED' event with NO meeting link (never a fake
      # Meet URL). Setting GOOGLE_CALENDAR_OAUTH_CLIENT_ID/_SECRET makes the real
      # Google path take over automatically; this flag is then ignored.
      CALENDAR_DEV_MODE: ${CALENDAR_DEV_MODE:-1}
      GOOGLE_CALENDAR_OAUTH_CLIENT_ID: ${GOOGLE_CALENDAR_OAUTH_CLIENT_ID:-}
      GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET: ${GOOGLE_CALENDAR_OAUTH_CLIENT_SECRET:-}
      # Only needed to override the localhost defaults. The redirect URI must
      # match the Google OAuth client exactly; the encryption key must be a real
      # Fernet key (not the "dev" sentinel) for real calendar token storage.
      GOOGLE_CALENDAR_OAUTH_REDIRECT_URI: ${GOOGLE_CALENDAR_OAUTH_REDIRECT_URI:-http://localhost:8000/api/v1/calendar/callback}
      CALENDAR_TOKEN_ENCRYPTION_KEY: ${CALENDAR_TOKEN_ENCRYPTION_KEY:-dev}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@smart-interview-scheduler.example}
      INTERVIEW_REMINDER_MINUTES_BEFORE: ${INTERVIEW_REMINDER_MINUTES_BEFORE:-15}
      INTERVIEW_NO_SHOW_GRACE_MINUTES: ${INTERVIEW_NO_SHOW_GRACE_MINUTES:-15}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  pgdata:
