# Phase 1 stack: Postgres + Redis + empty backend.
# `docker compose up --build` -> backend health at http://localhost:8000/health
#
# The frontend service is owned by the frontend teammate; uncomment it once
# ./frontend exists (see IMPLEMENTATION.md Phase 1 / Phase 10).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: sis
      POSTGRES_DB: sis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sis"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sis:sis@db:5432/sis
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     backend:
  #       condition: service_healthy

volumes:
  pgdata:
