[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-interview-scheduler-backend"
version = "0.1.0"
description = "Smart Interview Scheduler — backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pydantic[email]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "tzdata>=2024.2",  # zoneinfo has no tz database on Windows / slim images
    "redis>=5.2",
    "bcrypt>=4.2",
    "pyjwt>=2.10",
    "google-auth[requests]>=2.37",  # requests extra: needed by google.auth.transport.requests
    "httpx>=0.28",  # outbound Google Calendar HTTP (app/calendar/client.py)
    "cryptography>=43",  # Fernet: OAuth tokens encrypted at rest
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
